<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Игротека — О нас, Правила, История</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="mafia/tokens.css" />
<link rel="stylesheet" href="alias/tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.552.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
<style>html,body{margin:0;padding:0}body{font-family:"Manrope",system-ui,sans-serif}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="mafia/shared.jsx"></script>
<script type="text/babel" src="platform/chrome.jsx"></script>
<script type="text/babel" src="platform/screen-about.jsx"></script>
<script type="text/babel" src="platform/screen-rules.jsx"></script>
<script type="text/babel" src="platform/screen-history.jsx"></script>
<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="about" title="О нас" subtitle="Зачем сделан проект, как работает, планы и контакты">
        <DCArtboard id="about-desktop" label="О нас · 1180" width={1180} height={2260}>
          <AboutPage desktop={true} />
        </DCArtboard>
        <DCArtboard id="about-mobile" label="О нас · 390" width={390} height={3760}>
          <AboutPage />
        </DCArtboard>
      </DCSection>
      <DCSection id="rules" title="Правила" subtitle="Табы Алиас / Мафия — шаги партии, роли, спорные моменты">
        <DCArtboard id="rules-alias" label="Правила · Алиас · 1180" width={1180} height={2100}>
          <RulesPage desktop={true} initial="alias" />
        </DCArtboard>
        <DCArtboard id="rules-mafia" label="Правила · Мафия · 1180" width={1180} height={2100}>
          <RulesPage desktop={true} initial="mafia" />
        </DCArtboard>
        <DCArtboard id="rules-mobile" label="Правила · 390" width={390} height={3200}>
          <RulesPage initial="alias" />
        </DCArtboard>
      </DCSection>
      <DCSection id="history" title="История игр" subtitle="Общий архив партий Алиаса и Мафии — фильтр по игре, акцент по игре">
        <DCArtboard id="history-desktop" label="История · 1180" width={1180} height={1180}>
          <HistoryScreen desktop={true} />
        </DCArtboard>
        <DCArtboard id="history-mobile" label="История · 390" width={390} height={2160}>
          <HistoryScreen />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
