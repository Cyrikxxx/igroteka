<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Мафия — ключевые экраны</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="mafia/tokens.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.552.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: "Manrope", system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="mafia/shared.jsx"></script>
<script type="text/babel" src="mafia/screen-hub.jsx"></script>
<script type="text/babel" src="mafia/screen-lobby.jsx"></script>
<script type="text/babel" src="mafia/screen-role.jsx"></script>
<script type="text/babel" src="mafia/screen-night.jsx"></script>
<script type="text/babel" src="mafia/screen-vote.jsx"></script>
<script type="text/babel" src="mafia/tokens-board.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "crimson": "#e11d48",
  "vignette": 0.16,
  "radius": 20
}/*EDITMODE-END*/;

const CRIMSON_HOVER = { "#e11d48": "#f43f5e", "#dc2626": "#ef4444", "#be123c": "#e11d48" };

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    const s = document.documentElement.style;
    s.setProperty('--mf-crimson', t.crimson);
    s.setProperty('--mf-crimson-hover', CRIMSON_HOVER[t.crimson] || t.crimson);
    s.setProperty('--r-card', t.radius + 'px');
    s.setProperty('--vignette', String(t.vignette));
  }, [t]);

  return (
    <DesignCanvas>
      <DCSection id="hub" title="Хаб платформы" subtitle="Чернильный нейтральный фон, обе игры на равных">
        <DCArtboard id="hub-mobile" label="Хаб · 390" width={390} height={844}>
          <HubMobile />
        </DCArtboard>
        <DCArtboard id="hub-desktop" label="Хаб · 1180" width={1180} height={740}>
          <HubDesktop />
        </DCArtboard>
      </DCSection>

      <DCSection id="flow" title="Мафия — путь игрока" subtitle="Лобби → роль → ночь → голосование. Карту роли прижми и держи.">
        <DCArtboard id="lobby" label="Лобби (хост)" width={390} height={844}>
          <MafiaLobby />
        </DCArtboard>
        <DCArtboard id="role-mafia" label="Роль · интерактив" width={390} height={844}>
          <RoleReveal role="mafia" partners={['Кира', 'Стас']} label="Выдача роли — мафия" />
        </DCArtboard>
        <DCArtboard id="role-sheriff" label="Роль · Шериф (открыта)" width={390} height={844}>
          <RoleReveal role="sheriff" alwaysOpen={true} label="Выдача роли — шериф" />
        </DCArtboard>
        <DCArtboard id="night-mafia" label="Ночь · мафия" width={390} height={844}>
          <NightMafia />
        </DCArtboard>
        <DCArtboard id="vote" label="Голосование" width={390} height={844}>
          <VoteDay />
        </DCArtboard>
      </DCSection>

      <DCSection id="tokens" title="Токены зоны Мафии" subtitle="Для переноса в Tailwind-токены проекта">
        <DCArtboard id="tokens-board" label="Токены" width={1080} height={680}>
          <TokensBoard />
        </DCArtboard>
      </DCSection>

      <TweaksPanel>
        <TweakSection label="Акцент Мафии" />
        <TweakColor label="Crimson" value={t.crimson}
          options={['#e11d48', '#dc2626', '#be123c']}
          onChange={(v) => setTweak('crimson', v)} />
        <TweakSection label="Атмосфера" />
        <TweakSlider label="Ночная виньетка" value={t.vignette} min={0} max={0.4} step={0.02}
          onChange={(v) => setTweak('vignette', v)} />
        <TweakSlider label="Радиус карточек" value={t.radius} min={8} max={28} step={2} unit="px"
          onChange={(v) => setTweak('radius', v)} />
      </TweaksPanel>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
