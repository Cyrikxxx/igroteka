<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alias Online — Redesign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=2" />
  <link rel="stylesheet" href="screens.css?v=2" />
  <style>
    .app-root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="common.jsx?v=2"></script>
  <script type="text/babel" src="screen-home.jsx?v=2"></script>
  <script type="text/babel" src="screen-history.jsx?v=2"></script>
  <script type="text/babel" src="screen-online.jsx?v=2"></script>
  <script type="text/babel" src="screen-local.jsx?v=2"></script>
  <script type="text/babel" src="screen-game.jsx?v=2"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SCREENS = [
      { id: "home", n: "01", label: "Главная" },
      { id: "history", n: "02", label: "История игр" },
      { id: "join", n: "03", label: "Вход по коду" },
      { id: "create", n: "04", label: "Создать комнату" },
      { id: "lobbyHost", n: "05", label: "Лобби · хост" },
      { id: "lobbyGuest", n: "06", label: "Лобби · участник" },
      { id: "teams", n: "07", label: "Команды" },
      { id: "settings", n: "08", label: "Настройки" },
      { id: "pass", n: "09", label: "Передача устройства" },
      { id: "gameExplainer", n: "10", label: "Игра · объясняет" },
      { id: "gameGuesser", n: "11", label: "Игра · угадывает" },
      { id: "gameSpectator", n: "12", label: "Игра · зритель" },
      { id: "roundSummary", n: "13", label: "Итог раунда" },
      { id: "victory", n: "14", label: "Финал" },
    ];

    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem("alias-theme") || "dark");
      const [screen, setScreen] = useState(() => localStorage.getItem("alias-screen") || "home");

      useEffect(() => {
        const root = document.documentElement;
        root.classList.add("theme-switching");
        root.setAttribute("data-theme", theme);
        localStorage.setItem("alias-theme", theme);
        // force reflow so transitions that use var() re-resolve (Chromium cache bug)
        void root.offsetHeight;
        const id = requestAnimationFrame(() => root.classList.remove("theme-switching"));
        return () => cancelAnimationFrame(id);
      }, [theme]);
      useEffect(() => {
        localStorage.setItem("alias-screen", screen);
        window.scrollTo({ top: 0, behavior: "auto" });
      }, [screen]);

      const go = (s) => setScreen(s);

      const render = () => {
        switch (screen) {
          case "home": return <HomeScreen go={go} />;
          case "history": return <HistoryScreen go={go} />;
          case "join": return <JoinScreen go={go} />;
          case "create": return <CreateRoomScreen go={go} />;
          case "lobbyHost": return <LobbyScreen go={go} role="host" />;
          case "lobbyGuest": return <LobbyScreen go={go} role="guest" />;
          case "teams": return <TeamsScreen go={go} />;
          case "settings": return <SettingsScreen go={go} />;
          case "pass": return <PassScreen go={go} />;
          case "gameExplainer": return <GameScreen go={go} role="explainer" />;
          case "gameGuesser": return <GameScreen go={go} role="guesser" />;
          case "gameSpectator": return <GameScreen go={go} role="spectator" />;
          case "roundSummary": return <RoundSummary go={go} />;
          case "victory": return <Victory go={go} />;
          default: return <HomeScreen go={go} />;
        }
      };

      const hideHeader = screen === "gameExplainer" || screen === "gameGuesser" || screen === "gameSpectator";

      return (
        <div className="app app-root">
          {/* prototype chrome */}
          <div className="proto-bar">
            <span className="pb-label">экраны</span>
            <nav className="proto-nav">
              {SCREENS.map((s) => (
                <button
                  key={s.id}
                  className={"proto-tab" + (screen === s.id ? " on" : "")}
                  onClick={() => go(s.id)}
                >
                  <span className="tnum">{s.n}</span>{s.label}
                </button>
              ))}
            </nav>
            <ThemeToggle theme={theme} setTheme={setTheme} />
          </div>

          {/* product header (hidden on game screens which have their own) */}
          {!hideHeader && (
            <div className="app-header-wrap">
              <div className="shell">
                <AppHeader
                  theme={theme}
                  setTheme={setTheme}
                  onHome={() => go("home")}
                  right={
                    screen !== "history" && (
                      <button className="btn btn-ghost btn-sm header-hist" onClick={() => go("history")}>
                        <Icon name="clock" /> <span className="hist-label">История</span>
                      </button>
                    )
                  }
                />
              </div>
            </div>
          )}

          <div className="app-scroll" key={screen}>
            {render()}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="20" fill="#0a0d10" />
      <text x="50" y="62" font-size="46" font-family="monospace" font-weight="bold" text-anchor="middle" fill="#3dd7a0">A</text>
    </svg>
  </template>
</body>
</html>
