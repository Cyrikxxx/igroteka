# Продакшн на одном VPS: базы, оба приложения и реверс-прокси в одной сети.
# Наружу торчит только Caddy — Postgres и Redis портов не публикуют.
#
#   cp .env.example .env   # заполнить, chmod 600
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Первый запуск (миграции + словарь):
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml run --rm seed

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
      POSTGRES_DB: ${POSTGRES_DB:-alias}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alias} -d ${POSTGRES_DB:-alias}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    # appendonly — состояние комнат переживёт перезапуск контейнера.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WS_TOKEN_SECRET: ${WS_TOKEN_SECRET:?WS_TOKEN_SECRET обязателен}
      # Пусто — ws на том же домене, клиент подключится к origin страницы.
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ws:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # Обязан совпадать с web байт-в-байт, иначе «invalid token».
      WS_TOKEN_SECRET: ${WS_TOKEN_SECRET:?WS_TOKEN_SECRET обязателен}
      WS_CORS_ORIGIN: ${WS_CORS_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - ws

  # ─── Разовые задачи (docker compose run --rm <имя>) ───

  migrate:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
      # Стадия build — единственная, где есть и prisma CLI, и tsx для seed:
      # в рантайм-образе dev-зависимостей нет.
      target: build
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
      # Стадия build — единственная, где есть и prisma CLI, и tsx для seed:
      # в рантайм-образе dev-зависимостей нет.
      target: build
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["npx", "prisma", "db", "seed"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
